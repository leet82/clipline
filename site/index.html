<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clipline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Clipline</title>
<style>
  :root { --bg:#0e0e10; --card:#18181c; --line:#2a2a31; --text:#f2f2f5; --dim:#9a9aa6; --accent:#ff5c39; --ok:#3ccf8e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px;
           padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; background:rgba(14,14,16,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  header h1 { font-size:19px; margin:0; letter-spacing:-.3px; }
  header h1 b { color:var(--accent); }
  #count { color:var(--dim); font-size:13px; flex:1; }
  .icon-btn { background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:7px 11px; font-size:13px; }
  main { padding:12px 12px calc(env(safe-area-inset-bottom) + 90px); display:flex; flex-direction:column; gap:14px; max-width:520px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .vid { position:relative; background:#000; aspect-ratio:9/16; max-height:64vh; margin:0 auto; display:block; }
  .vid video { width:100%; height:100%; display:block; object-fit:contain; background:#000; }
  .meta { padding:12px 14px 4px; display:flex; gap:8px; align-items:center; color:var(--dim); font-size:13px; flex-wrap:wrap; }
  .meta strong { color:var(--text); font-weight:600; }
  .score { margin-left:auto; padding:2px 8px; border-radius:20px; font-weight:600; font-size:12px; background:#26262d; color:var(--text); }
  .score.hi { background:rgba(60,207,142,.15); color:var(--ok); }
  textarea { width:calc(100% - 28px); margin:6px 14px 0; background:#0f0f12; border:1px solid var(--line); color:var(--text);
             border-radius:12px; padding:10px 12px; font:inherit; resize:none; min-height:70px; }
  .row { display:flex; gap:10px; padding:12px 14px 14px; }
  .row button { flex:1; border:0; border-radius:14px; padding:14px; font:600 16px/1 inherit; }
  .skip { background:#26262d; color:var(--text); }
  .post { background:var(--accent); color:#fff; }
  .post[disabled] { opacity:.6; }
  .info { padding:2px 14px 0; font-size:13px; color:var(--dim); }
  .info b { color:var(--text); font-weight:600; }
  .risk { margin:6px 14px 0; padding:7px 10px; border-radius:10px; background:rgba(255,92,57,.12); color:#ffb4a3; font-size:13px; }
  .yt { margin:8px 14px 0; background:none; border:1px solid var(--line); color:var(--dim); border-radius:10px; padding:6px 10px; font-size:12px; }
  .src { display:block; padding:0 14px 12px; color:var(--dim); font-size:12px; text-decoration:none; }
  .empty, .pin { text-align:center; color:var(--dim); padding:60px 24px; }
  .empty h2, .pin h2 { color:var(--text); font-size:20px; margin:0 0 8px; }
  .pin input { margin-top:16px; width:180px; text-align:center; font-size:24px; letter-spacing:6px; padding:12px; border-radius:14px;
               border:1px solid var(--line); background:var(--card); color:var(--text); }
  .pin button { display:block; margin:14px auto 0; background:var(--accent); color:#fff; border:0; border-radius:14px; padding:12px 28px; font:600 16px inherit; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 20px); transform:translateX(-50%) translateY(140%);
           background:#26262d; border:1px solid var(--line); color:var(--text); padding:12px 16px; border-radius:14px; display:flex; gap:14px;
           align-items:center; transition:transform .25s; max-width:92vw; font-size:14px; z-index:10; }
  #toast.show { transform:translateX(-50%) translateY(0); }
  #toast button { background:none; border:0; color:var(--accent); font:600 14px inherit; }
  /* side panel */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; }
  #scrim.show { opacity:1; pointer-events:auto; }
  #panel { position:fixed; top:0; right:0; bottom:0; width:min(420px, 92vw); background:var(--bg); border-left:1px solid var(--line);
           transform:translateX(100%); transition:transform .25s; z-index:21; overflow-y:auto; -webkit-overflow-scrolling:touch;
           padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  #panel.show { transform:none; }
  #panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim); margin:22px 0 8px; }
  #panel .top { display:flex; align-items:center; justify-content:space-between; }
  #panel .top h2 { margin:0; font-size:19px; text-transform:none; letter-spacing:-.3px; color:var(--text); }
  .run { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; font-size:13px; }
  .run .st { width:9px; height:9px; border-radius:50%; flex:none; background:var(--dim); }
  .run .st.live { background:#ffc23d; animation:pulse 1.2s infinite; } .run .st.ok { background:var(--ok); } .run .st.bad { background:var(--accent); }
  @keyframes pulse { 50% { opacity:.35; } }
  .run .what { flex:1; min-width:0; } .run .what small { display:block; color:var(--dim); }
  .run button, .chip, .seg button { background:#26262d; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:6px 10px; font:600 13px inherit; }
  .run button.stop { color:#ffb4a3; }
  .seg { display:flex; gap:6px; } .seg button { flex:1; padding:10px 6px; } .seg button small { display:block; font-weight:400; color:var(--dim); font-size:11px; margin-top:2px; }
  .seg button.on, .chip.on { background:rgba(255,92,57,.15); border-color:var(--accent); color:#fff; }
  #links { width:100%; margin:8px 0 0; min-height:56px; }
  .go { width:100%; margin-top:8px; border:0; border-radius:12px; padding:12px; background:var(--accent); color:#fff; font:600 15px inherit; }
  .toggle { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:14px; }
  .toggle input { width:22px; height:22px; accent-color:var(--accent); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; } .chip { font-weight:500; padding:5px 10px; border-radius:20px; }
  .arc { padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .arc b { display:block; font-size:14px; font-weight:600; margin-bottom:2px; }
  .arc .sub { color:var(--dim); } .arc .why { color:var(--dim); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .arc a { color:var(--accent); text-decoration:none; margin-right:12px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; background:#26262d; margin-left:4px; }
  .tag.posted { color:var(--ok); } .tag.skipped { color:var(--dim); } .tag.filtered { color:#ffc23d; } .tag.error { color:#ffb4a3; } .tag.pending { color:#9cc3ff; }
  .muted { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Clip<b>line</b></h1>
  <span id="count"></span>
  <button class="icon-btn" id="runBtn" hidden>Run now</button>
  <button class="icon-btn" id="menuBtn" hidden aria-label="Runs and archive">☰</button>
</header>
<div id="scrim"></div>
<aside id="panel" aria-hidden="true">
  <div class="top"><h2>Runs &amp; archive</h2><button class="icon-btn" id="closeBtn">Close</button></div>
  <h2>Runs</h2>
  <div id="runs"><div class="muted">Loading…</div></div>
  <h2>Start a run</h2>
  <div class="seg" id="vol">
    <button data-v="normal" class="on">Normal<small>config.yml</small></button>
    <button data-v="more">More<small>15 clips · 3 days</small></button>
    <button data-v="max">Max<small>30 clips · 7 days</small></button>
  </div>
  <textarea id="links" placeholder="Optional: paste Twitch clip links to clip these exact moments"></textarea>
  <button class="go" id="startBtn">Start run</button>
  <h2>Schedule</h2>
  <label class="toggle"><span>Auto-run every 4 hours</span><input type="checkbox" id="autoRun" checked></label>
  <h2>Archive</h2>
  <div class="chips" id="arcFilter">
    <button class="chip on" data-f="all">All</button><button class="chip" data-f="posted">Posted</button>
    <button class="chip" data-f="pending">To review</button><button class="chip" data-f="skipped">Skipped</button>
    <button class="chip" data-f="filtered">Filtered</button><button class="chip" data-f="error">Errors</button>
  </div>
  <div id="archive"><div class="muted">Loading…</div></div>
</aside>
<main id="main"></main>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let token = store.get("clipline-token");
let repo = "";
let clips = [];
let liveDecisions = {};
const files = new Map();      // id -> File (prefetched so the share sheet opens instantly)
const DECISIONS = "data/decisions.json";

// Talks straight to the GitHub API with the fine-grained token saved on this phone.
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${repo}${path}`, {
    ...opts, cache: "no-store",
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", ...(opts.headers || {}) },
  });
  if (r.status === 401) { store.del("clipline-token"); token = null; showPin("That token didn't work. Paste it again."); throw new Error("pin"); }
  return r;
}
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const b64encode = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));

async function readDecisions() {
  const r = await gh(`/contents/${DECISIONS}?ref=main`);
  if (r.status === 404) return { data: {}, sha: undefined };
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  const j = await r.json();
  return { data: JSON.parse(b64decode(j.content) || "{}"), sha: j.sha };
}

// Generic read-modify-write of a JSON file in the repo, retrying on sha conflicts.
async function readJSON(path) {
  const r = await gh(`/contents/${path}?ref=main`);
  if (r.status === 404) return { data: {}, sha: undefined };
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  const j = await r.json();
  return { data: JSON.parse(b64decode(j.content) || "{}"), sha: j.sha };
}
async function updateJSON(path, mutate, message) {
  for (let attempt = 0; attempt < 4; attempt++) {
    const { data, sha } = await readJSON(path);
    mutate(data);
    const r = await gh(`/contents/${path}`, { method: "PUT",
      body: JSON.stringify({ message, sha, branch: "main", content: b64encode(JSON.stringify(data, null, 1) + "\n") }) });
    if (r.ok) return data;
    if (r.status !== 409 && r.status !== 422) throw new Error(`GitHub ${r.status}`);
  }
  throw new Error("conflict, try again");
}

async function api(method, body) {
  if (method === "GET") return (await readDecisions()).data;
  if (body.action === "run") {
    const r = await gh(`/actions/workflows/worker.yml/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main" }) });
    if (!r.ok) throw new Error(`GitHub ${r.status}`);
    return {};
  }
  for (let attempt = 0; attempt < 4; attempt++) {
    const { data, sha } = await readDecisions();
    if (body.action === "undo") delete data[body.id];
    else data[body.id] = { action: body.action, at: new Date().toISOString() };
    const r = await gh(`/contents/${DECISIONS}`, {
      method: "PUT",
      body: JSON.stringify({ message: `review: ${body.action} ${body.id}`, sha, branch: "main",
                             content: b64encode(JSON.stringify(data, null, 1) + "\n") }),
    });
    if (r.ok) return {};
    if (r.status !== 409 && r.status !== 422) throw new Error(`GitHub ${r.status}`);
  }
  throw new Error("conflict, try again");
}

let toastTimer;
function toast(msg, btnText, onBtn) {
  $("#toastMsg").textContent = msg;
  const b = $("#toastBtn");
  b.textContent = btnText || ""; b.hidden = !btnText; b.onclick = () => { $("#toast").classList.remove("show"); onBtn && onBtn(); };
  $("#toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("#toast").classList.remove("show"), btnText ? 5000 : 3000);
}

function showPin(err) {
  $("#runBtn").hidden = true; $("#menuBtn").hidden = true; $("#count").textContent = "";
  $("#main").innerHTML = `<div class="pin"><h2>Paste your GitHub token</h2><div>${err || "The fine-grained token for the clipline repo. It's saved only on this phone."}</div>
    <input id="pinIn" type="password" autocomplete="off" style="width:260px;font-size:15px;letter-spacing:0"><button id="pinGo">Save</button></div>`;
  const go = () => { token = $("#pinIn").value.trim(); if (!token) return; store.set("clipline-token", token); load(); };
  $("#pinGo").onclick = go; $("#pinIn").onkeydown = e => e.key === "Enter" && go();
}

// TikTok caption (from Claude) + hashtags; older clips fall back to the title.
function caption(c) {
  if (c.text != null) return c.text;
  return `${c.caption || c.title}\n${(c.hashtags || []).join(" ")}`.trim();
}

function render() {
  const live = clips.filter(c => !c.decision);
  $("#count").textContent = live.length ? `${live.length} to review` : "";
  $("#runBtn").hidden = false; $("#menuBtn").hidden = false;
  if (!live.length) {
    $("#main").innerHTML = `<div class="empty"><h2>All caught up</h2>
      <div>The worker checks for new clips every 4 hours.<br>Tap <b>Run now</b> to check right away; new clips show up here a few minutes after it finishes.</div></div>`;
    return;
  }
  $("#main").innerHTML = "";
  for (const c of live) {
    const el = document.createElement("article");
    el.className = "card"; el.dataset.id = c.id;
    el.innerHTML = `
      <div class="vid"><video src="clips/${c.video}" poster="clips/${c.thumb}" controls playsinline preload="none"></video></div>
      <div class="meta"><strong></strong> · ${Number(c.views).toLocaleString()} views · ${Math.round(c.duration)}s
        ${c.score != null ? `<span class="score ${c.score >= 8 ? "hi" : ""}">${c.score}/10</span>` : ""}</div>
      <div class="info hook"></div>
      <div class="info why"></div>
      <div class="risk" hidden></div>
      <textarea rows="4"></textarea>
      <button class="yt">Copy YouTube title</button>
      <div class="row"><button class="skip">Skip</button><button class="post">Post ↗</button></div>
      <a class="src" target="_blank" rel="noopener">Twitch clip: </a>`;
    $("strong", el).textContent = c.streamer;
    if (c.hook) { $(".hook", el).innerHTML = "<b>Hook:</b> "; $(".hook", el).append(c.hook + (c.archetype ? ` (${c.archetype})` : "")); }
    $(".why", el).textContent = [c.game, c.payoff || c.reason].filter(Boolean).join(" · ");
    if (c.risks && c.risks.length) { const r = $(".risk", el); r.hidden = false; r.textContent = "⚠ " + c.risks.join(" · "); }
    const ta = $("textarea", el); ta.value = caption(c);
    ta.oninput = () => { c.text = ta.value; };
    $(".yt", el).onclick = async () => {
      try { await navigator.clipboard.writeText(c.title); toast("YouTube title copied"); } catch { toast("Couldn't copy"); }
    };
    const a = $(".src", el); a.href = c.source_url; a.textContent += c.twitch_title;
    $(".skip", el).onclick = () => decide(c, "skipped", el);
    $(".post", el).onclick = () => post(c, el);
    $("#main").appendChild(el);
    io.observe(el);
  }
}

// Prefetch the mp4 as a File once a card is near the screen (iOS needs share() right inside the tap).
const io = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) { io.unobserve(e.target); prefetch(clips.find(c => c.id === e.target.dataset.id)); }
}, { rootMargin: "400px" });

async function prefetch(c) {
  if (!c || files.has(c.id)) return;
  files.set(c.id, null);
  try {
    const blob = await (await fetch(`clips/${c.video}`)).blob();
    files.set(c.id, new File([blob], c.video, { type: "video/mp4" }));
  } catch { files.delete(c.id); }
}

async function post(c, el) {
  const btn = $(".post", el);
  const text = caption(c);
  try { navigator.clipboard && navigator.clipboard.writeText(text); } catch {}
  const file = files.get(c.id);
  if (!file) {
    btn.disabled = true; btn.textContent = "Preparing…";
    await prefetch(c);
    btn.disabled = false; btn.textContent = files.get(c.id) ? "Tap to share ↗" : "Post ↗";
    return;
  }
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], text });
    } catch (e) {
      if (e.name === "AbortError") return;      // closed the share sheet, nothing posted
      toast("Share failed: " + e.message); return;
    }
    return decide(c, "posted", el);
  }
  // No file sharing (desktop browser): open the video to save it, then confirm.
  window.open(`clips/${c.video}`, "_blank");
  btn.textContent = "Mark as posted ✓"; btn.onclick = () => decide(c, "posted", el);
}

async function decide(c, action, el) {
  c.decision = action;
  el.remove(); render();
  const undo = async () => { c.decision = null; render(); try { await api("POST", { id: c.id, action: "undo" }); } catch {} };
  toast(action === "posted" ? "Posted. Caption copied. Submit the link on Whop within 30 min." : "Skipped", "Undo", undo);
  try { await api("POST", { id: c.id, action }); }
  catch (e) { if (e.message !== "pin") { c.decision = null; render(); toast("Couldn't save: " + e.message); } }
}

$("#runBtn").onclick = async () => {
  try { await api("POST", { action: "run" }); toast("Worker started. Takes about 5 to 15 min."); }
  catch (e) { if (e.message !== "pin") toast("Couldn't start: " + e.message); }
};

async function load() {
  if (!token) return showPin();
  try {
    const site = await fetch("clips.json", { cache: "no-store" }).then(r => r.json());
    repo = site.repo;
    const decisions = await api("GET");
    liveDecisions = decisions;
    clips = site.clips.map(c => ({ ...c, decision: decisions[c.id]?.action || null }));
    render();
  } catch (e) {
    if (e.message !== "pin") $("#main").innerHTML = `<div class="empty"><h2>Couldn't load</h2><div>${String(e.message)}</div></div>`;
  }
}

// ---------------------------------------------------------------- side panel
const VOLUMES = { normal: {}, more: { max_new: "15", lookback_hours: "72" }, max: { max_new: "30", lookback_hours: "168" } };
let volume = "normal", arcFilter = "all", archive = null, pollTimer = null;
const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const node = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function openPanel() {
  $("#panel").classList.add("show"); $("#scrim").classList.add("show"); $("#panel").setAttribute("aria-hidden", "false");
  loadRuns(); loadArchive(); loadControl();
}
function closePanel() {
  $("#panel").classList.remove("show"); $("#scrim").classList.remove("show"); $("#panel").setAttribute("aria-hidden", "true");
  clearTimeout(pollTimer);
}

async function loadRuns() {
  clearTimeout(pollTimer);
  try {
    const r = await gh(`/actions/workflows/worker.yml/runs?per_page=6`);
    if (!r.ok) throw new Error(`GitHub ${r.status}`);
    const runs = (await r.json()).workflow_runs;
    const box = $("#runs"); box.innerHTML = "";
    if (!runs.length) box.append(node("div", "muted", "No runs yet."));
    let live = false;
    for (const run of runs) {
      const active = run.status !== "completed"; live ||= active;
      const row = node("div", "run");
      const dot = node("span", "st " + (active ? "live" : run.conclusion === "success" ? "ok" : run.conclusion === "cancelled" ? "" : "bad"));
      const label = active ? (run.status === "queued" || run.status === "waiting" ? "Queued" : "Running")
        : run.conclusion === "success" ? "Done" : run.conclusion === "cancelled" ? "Stopped" : "Failed";
      const mins = Math.max(1, Math.round((new Date(active ? Date.now() : run.updated_at) - new Date(run.run_started_at || run.created_at)) / 60000));
      const what = node("div", "what", `${label} · ${run.event === "schedule" ? "scheduled" : run.event === "push" ? "app update" : "manual"}`);
      what.append(node("small", null, `${ago(run.created_at)} · ${mins} min`));
      row.append(dot, what);
      if (active) {
        const b = node("button", "stop", "Stop");
        b.onclick = async () => {
          b.disabled = true; b.textContent = "Stopping…";
          const c = await gh(`/actions/runs/${run.id}/cancel`, { method: "POST" });
          toast(c.ok || c.status === 202 ? "Stopping run. Clips finished so far are kept." : `Couldn't stop (GitHub ${c.status})`);
          setTimeout(loadRuns, 3000);
        };
        row.append(b);
      } else {
        const a = node("a", null, "Log"); a.href = run.html_url; a.target = "_blank"; a.rel = "noopener";
        a.style.cssText = "color:var(--dim);text-decoration:none;font-size:13px"; row.append(a);
      }
      box.append(row);
    }
    if (live && $("#panel").classList.contains("show")) pollTimer = setTimeout(loadRuns, 8000);
  } catch (e) { if (e.message !== "pin") $("#runs").innerHTML = `<div class="muted">Couldn't load runs: ${String(e.message)}</div>`; }
}

async function startRun() {
  const btn = $("#startBtn"); btn.disabled = true;
  const inputs = { ...VOLUMES[volume] };
  const links = $("#links").value.trim();
  if (links) inputs.clips = links;
  try {
    const r = await gh(`/actions/workflows/worker.yml/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main", inputs }) });
    if (!r.ok) throw new Error(`GitHub ${r.status}`);
    $("#links").value = "";
    toast(volume === "normal" ? "Run started." : `Run started (${volume}). Bigger runs take longer.`);
    setTimeout(loadRuns, 2500);
  } catch (e) { if (e.message !== "pin") toast("Couldn't start: " + e.message); }
  btn.disabled = false;
}

async function loadControl() {
  try { const { data } = await readJSON("data/control.json"); $("#autoRun").checked = !data.paused; } catch {}
}
async function setAuto(on) {
  try {
    await updateJSON("data/control.json", d => { d.paused = !on; d.at = new Date().toISOString(); }, on ? "app: resume auto-runs" : "app: pause auto-runs");
    toast(on ? "Auto-runs on." : "Auto-runs paused. Manual runs still work.");
  } catch (e) { $("#autoRun").checked = !on; if (e.message !== "pin") toast("Couldn't save: " + e.message); }
}

async function loadArchive() {
  try {
    if (!archive) archive = await fetch("archive.json", { cache: "no-store" }).then(r => r.ok ? r.json() : []);
  } catch { archive = []; }
  renderArchive();
}
function renderArchive() {
  const box = $("#archive"); box.innerHTML = "";
  const rows = (archive || []).map(a => {
    const d = liveDecisions[a.id]?.action || a.decision;
    return { ...a, state: d || (a.status === "pending" ? "pending" : a.status) };
  }).filter(a => arcFilter === "all" || a.state === arcFilter);
  if (!rows.length) { box.append(node("div", "muted", "Nothing here yet.")); return; }
  const label = { posted: "posted", skipped: "skipped", filtered: "filtered", error: "error", pending: "to review" };
  for (const a of rows.slice(0, 150)) {
    const row = node("div", "arc");
    const b = node("b", null, a.hook || a.title || a.id);
    b.append(node("span", "tag " + a.state, label[a.state] || a.state));
    const sub = [a.streamer, a.game, a.score != null ? `${a.score}/10` : null, a.duration ? `${Math.round(a.duration)}s` : null, ago(a.added_at)]
      .filter(Boolean).join(" · ");
    row.append(b, node("div", "sub", sub));
    const why = a.state === "error" ? a.error : a.reason;
    if (why) row.append(node("div", "why", why));
    const links = node("div"); links.style.marginTop = "5px";
    if (a.video_url) { const v = node("a", null, "Video"); v.href = a.video_url; v.target = "_blank"; v.rel = "noopener"; links.append(v); }
    const t = node("a", null, "Twitch"); t.href = a.source_url; t.target = "_blank"; t.rel = "noopener"; links.append(t);
    row.append(links); box.append(row);
  }
  if (rows.length > 150) box.append(node("div", "muted", `+ ${rows.length - 150} older`));
}

$("#menuBtn").onclick = openPanel;
$("#closeBtn").onclick = closePanel;
$("#scrim").onclick = closePanel;
$("#startBtn").onclick = startRun;
$("#autoRun").onchange = e => setAuto(e.target.checked);
$("#vol").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  volume = b.dataset.v; for (const x of $("#vol").children) x.classList.toggle("on", x === b); };
$("#arcFilter").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  arcFilter = b.dataset.f; for (const x of $("#arcFilter").children) x.classList.toggle("on", x === b); renderArchive(); };

load();
</script>
</body>
</html>
